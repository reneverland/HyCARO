[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repomaro-experiments"
version = "0.1.0"
description = "HyCARO: hypergraph-catalyzed search for budgeted repository context selection"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.24",
  "networkx>=3.0",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "openai>=1.40",
]

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0", "torch>=2.1"]
benchmarks = ["datasets>=2.20", "pandas>=2.0", "pyarrow>=15"]
tokens = ["tiktoken>=0.7"]
dev = ["pytest>=8.0"]
all = [
  "sentence-transformers>=3.0",
  "torch>=2.1",
  "datasets>=2.20",
  "pandas>=2.0",
  "pyarrow>=15",
  "tiktoken>=0.7",
  "pytest>=8.0",
]

[project.scripts]
repomaro = "repomaro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
